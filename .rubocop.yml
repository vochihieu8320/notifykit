plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "spec/dummy/db/schema.rb"
    - "tmp/**/*"

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 120
Metrics/ClassLength:
  Max: 150
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
RSpec/MultipleExpectations:
  Max: 4
RSpec/ExampleLength:
  Max: 25
RSpec/NestedGroups:
  Max: 4
RSpec/MultipleMemoizedHelpers:
  Max: 10

# Integration/conformance specs are organised by behaviour, not by class path.
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/integration/**/*"
    - "spec/conformance/**/*"
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
Metrics/MethodLength:
  Max: 20
  Exclude:
    - "spec/dummy/db/migrate/**/*"
    - "lib/generators/**/templates/**/*"
# Keyword arguments are self-documenting; only count positional ones.
Metrics/ParameterLists:
  CountKeywordArgs: false
Naming/PredicateMethod:
  AllowedMethods:
    - release!
Metrics/AbcSize:
  Max: 25
  Exclude:
    - "spec/dummy/db/migrate/**/*"
